[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=memberbase --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["memberbase"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/"]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 120
