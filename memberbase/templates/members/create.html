{% extends "base.html" %}
{% from "macros/ui.html" import csrf %}
{% block title %}Nová osoba – Evidence členů{% endblock %}
{% block content %}
<h2>Nová osoba</h2>
<form method="post" class="card maxw-form">
  {{ csrf() }}
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label" for="name">Celé jméno</label>
      <input class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required maxlength="120">
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">E-mail (slouží k přihlášení)</label>
      <input class="form-control" id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="phone">Telefon</label>
      <input class="form-control" id="phone" name="phone" value="{{ form.get('phone', '') }}" inputmode="tel">
    </div>
    <div class="mb-3">
      <label class="form-label" for="unit">Místní skupina</label>
      <select class="form-select" id="unit" name="unit" required>
        <option value="">— Vyberte —</option>
        {% for u in units %}<option value="{{ u.id }}" {{ 'selected' if form.get('unit') == u.id }}>{{ u.name }}</option>{% endfor %}
      </select>
      <div class="form-text">„Externí uživatelé“ nepatří do žádné místní skupiny.</div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="invite" name="invite" value="1" {{ 'checked' if not form or form.get('invite') }}>
      <label class="form-check-label" for="invite">Hned poslat pozvánku e-mailem</label>
    </div>
    <button class="btn btn-danger">Vytvořit</button>
    <a href="{{ url_for('members.index') }}" class="btn btn-outline-secondary">Zpět</a>
  </div>
</form>
{% endblock %}
